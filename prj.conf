CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
# SHT3XD driver is enabled by the devicetree node
# USART1 is wired to the CM1106S sensor, so there is no console on this board
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Forces the MCU to keep the SWD/Debug clock enabled during low-power sleep states
CONFIG_DEBUG=y
CONFIG_PM_DEVICE=y

# software PWM of the LEDs runs from a 100 us timer
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# settings and chart history: Zephyr settings subsystem on NVS in the storage partition
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
# the whole storage partition (16 sectors of 2 KB) for NVS: wear leveling over all of it
CONFIG_SETTINGS_NVS_SECTOR_COUNT=16
# name lookups from RAM: the history uses 51 items, a lookup would read every name from flash otherwise
CONFIG_SETTINGS_NVS_NAME_CACHE=y
CONFIG_SETTINGS_NVS_NAME_CACHE_SIZE=128
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Zephyr LED API (driver: src/led_swpwm.c) and buzzer API (gpio-buzzer node in the board dts)
CONFIG_LED=y
CONFIG_BUZZER=y

# CM1106S supply: Zephyr regulator API (regulator-fixed node in the board dts)
CONFIG_REGULATOR=y

# touch keys: input subsystem (gpio-keys + longpress nodes in the board dts)
CONFIG_INPUT=y

# UI runs in the main thread (draws, writes NVS)
CONFIG_MAIN_STACK_SIZE=4096

# State Machine Framework (UI and start-up sequence)
CONFIG_SMF=y
CONFIG_SMF_ANCESTOR_SUPPORT=y

# watchdog: task watchdog on the IWDG, every thread feeds its own channel
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y
