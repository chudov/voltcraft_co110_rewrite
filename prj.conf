CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
# SHT3XD driver is enabled by the devicetree node
# USART1 is wired to the CM1106S sensor, so there is no console on this board
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n

# Forces the MCU to keep the SWD/Debug clock enabled during low-power sleep states
CONFIG_DEBUG=y
CONFIG_PM_DEVICE=y

# software PWM of the LEDs runs from a 100 us timer
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
